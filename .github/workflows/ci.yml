name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 准备内置运行时
        run: npm run prepare:resources

      - name: 发布门禁（敏感信息与版本检查）
        run: npm run check:release

      - name: 依赖安全审计
        run: npm audit --audit-level=high
