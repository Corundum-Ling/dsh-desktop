appId: com.corundum.dsh-desktop
productName: DeepSeek Harness
copyright: Copyright © 2026 CorunLing

directories:
  output: dist

files:
  - src/**
  - LICENSE
  - THIRD-PARTY-NOTICES.md

# Coupling: `to: resources` must stay aligned with RESOURCES_DIR in src/main/index.js.
# node.exe / pnpm.exe / dsh 必须为磁盘真实文件（asar 虚拟文件系统无法被外部 node.exe 读取）
extraResources:
  - from: resources
    to: resources
    filter:
      - node/node.exe
      - bin/pnpm.exe
      - "licenses/**"
      - "dsh/**"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  deleteAppDataOnUninstall: false

npmRebuild: false
